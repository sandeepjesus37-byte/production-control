<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Production Control - Demo (sample data)</title>
<style>
:root{--page:#f3f5f8;--surface:#fff;--ink:#1c2733;--muted:#667385;--line:#e2e7ee;--accent:#12a58c;--accent-dark:#0c7d6a;--accent-soft:#e5f5f1;--crit:#e05263;--warn:#f0a63a;--blue:#3a7bd5;--violet:#9b59b6;--grid:#eaeff2;
--open-bg:#fff3d9;--open:#b87400;--over-bg:#fde9e9;--over:#c93636;--prog-bg:#e5eeff;--prog:#2563c9;--ok-bg:#e2f5ea;--ok:#1b8a4e;--shadow:0 1px 2px rgba(20,30,40,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#10161c;--surface:#18212a;--ink:#eef4f8;--muted:#a9bac6;--line:#2a3745;--accent:#1fc7ab;--accent-dark:#16b39a;--accent-soft:#16332f;--crit:#e8677a;--grid:#253240;--open-bg:#3b2f12;--open:#f0b84a;--over-bg:#3d1e24;--over:#f08a95;--prog-bg:#1c2c4a;--prog:#7fa8f0;--ok-bg:#173626;--ok:#58cf8b;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 "Inter",system-ui,"Segoe UI",Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent-dark);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:2px 6px 8px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.env{display:inline-block;margin:0 6px 8px;font-size:10.5px;letter-spacing:.06em;font-weight:700;color:var(--accent-dark);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.grp>button.gh{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.grp>button.gh:hover{background:var(--accent-soft)}
.grp .chev{transition:transform .15s;color:var(--muted)}.grp.open .chev{transform:rotate(90deg)}
.grp .items{display:none;padding:2px 0 6px 12px}.grp.open .items{display:block}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:13.5px}
.nav:hover{background:var(--accent-soft)}.nav.on{background:var(--accent-soft);color:var(--accent-dark);font-weight:600}
.pill{background:var(--crit);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
.side .foot{margin-top:auto;padding:12px 8px 0;color:var(--muted);font-size:12px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.crumb{color:var(--muted)}.crumb b{color:var(--ink)}.top .sp{flex:1}
.top label{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;max-width:100%}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--crit);color:#fff;font:700 10px/1 system-ui;border-radius:99px;padding:3px 5px;font-style:normal}
.who{display:flex;align-items:center;gap:8px;font-weight:600}.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.page{padding:20px 22px 70px;max-width:1340px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 4px}h3{font-size:14px;margin:0}
.sub{color:var(--muted);margin:0 0 14px;max-width:90ch}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.sm{padding:3px 10px;font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--accent)}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.ic.a{background:var(--open-bg)}.ic.r{background:var(--over-bg)}.ic.b{background:var(--prog-bg)}.ic.g{background:var(--ok-bg)}.ic.t{background:var(--accent-soft)}
.num{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}.num small{font-size:14px;color:var(--muted);font-weight:500}
.lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.hint{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.two.e{grid-template-columns:1fr 1fr}.two{align-items:start}.two>*{min-width:0}
@media(max-width:1000px){.two,.two.e{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{position:static;height:auto}}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}
.cell{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;cursor:pointer}
.cell.red{border-left-color:var(--crit)}.cell:hover{background:var(--accent-soft)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;margin:2px 4px 2px 0;white-space:nowrap}
.c-open{background:var(--open-bg);color:var(--open)}.c-over{background:var(--over-bg);color:var(--over)}.c-done,.c-ok{background:var(--ok-bg);color:var(--ok)}.c-prog{background:var(--prog-bg);color:var(--prog)}.c-crit{background:var(--over-bg);color:var(--over)}.c-warn{background:var(--open-bg);color:var(--open)}.c-idle{background:var(--line);color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-soft)}
.tw{overflow:auto;max-height:440px}.tw.tall{max-height:640px}.nw td{white-space:nowrap}.page{padding-bottom:70px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;cursor:pointer;font-weight:600;font-size:13px}.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:8px;background:var(--grid);border-radius:99px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}.bar i.w{background:var(--warn)}.bar i.c{background:var(--crit)}
.hb{display:grid;grid-template-columns:150px 1fr 130px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.hb .bar{height:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.stat>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat b{display:block;font-size:20px;margin-top:2px}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}.filters label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,16,22,.5);display:grid;place-items:center;z-index:30;padding:16px}
.modal>div{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.form{display:grid;gap:12px}.form label{display:grid;gap:4px;font-weight:600;font-size:13px}.form .row{display:flex;gap:12px;flex-wrap:wrap}.form .row>label{flex:1;min-width:150px}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.demo{position:fixed;right:14px;bottom:12px;background:#fff3c4;color:#7a5b00;border:1px solid #e6cf7a;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;z-index:40}
.empty{color:var(--muted);padding:12px 0}
.scells{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:10px 0 14px}
.sc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
svg text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
@media(max-width:640px){.page{padding:14px 12px 70px}.hb{grid-template-columns:100px 1fr 90px}.top{padding:8px 12px}}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="brand"><div class="logo">PC</div>Production Control</div>
  <span class="env">DEMO</span>
  <div id="nav"></div>
  <div class="foot">v2.2 · sample data only</div>
 </aside>
 <div class="main">
  <div class="top"><div class="crumb" id="crumb"></div><div class="sp"></div>
   <label>Cell <select id="cellSel"></select></label>
   <label>Date <input type="date" id="dateSel" value="2026-11-09" disabled title="Fixed for the demo"></label>
   <button class="bell" id="bell" title="Overdue items">🔔<i id="bellN">0</i></button>
   <div class="who"><div class="av">D</div>Demo manager</div></div>
  <div class="page" id="page"></div>
 </div>
</div>
<div class="demo">DEMO · sample data only</div>
<div id="modal"></div>

<script>
(function(){

'use strict';
/* ================= sample data: everything below is invented ================= */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var R=rng(20261109),ri=function(a,b){return a+Math.floor(R()*(b-a+1))},pick=function(a){return a[Math.floor(R()*a.length)]};
var TODAY='2026-11-09',NOW_MIN=10*60+32;
function addDays(d,n){var x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dd(d){return d.slice(8)+' '+MON[+d.slice(5,7)-1]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hh(x){var h=0;for(var i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))>>>0;return h}
function fmtMin(m){m=Math.round(m);if(m<60)return m+' min';var h=Math.floor(m/60);return h+' h '+(m%60?m%60+' min':'')}
function hm(m){m=((m%1440)+1440)%1440;return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2)}

var CELLS=[{id:'1',name:'Cell 1'},{id:'2',name:'Cell 2'},{id:'3',name:'Cell 3'}];
var STAGES=[{n:'CNC 1',cyc:6.2},{n:'CNC 2',cyc:14.5},{n:'CNC 3',cyc:24.8},{n:'CNC 4',cyc:29}];
var PEOPLE=['Ana R','Ben T','Dara M','Eli N','Faye O','Hana Q','Ivo S','Kai V','Lena P','Milo C'];
var TDESC=[['Face mill D50',900],['End mill D12 rough',450],['End mill D8 finish',300],['Drill D6',600],['Reamer D6',500],['Chamfer mill',700]];
var FORMS=[
 {k:'correction-entry',n:'Correction Entry',wait:'Correction approval',next:'Approve and close',who:'Quality',reason:['Tool 3 length wear +0.004','Work offset updated after re-probe','Tool 5 diameter wear entry']},
 {k:'tool-change',n:'Tool Change',wait:'Tool change',next:'Replace the tool and log it',who:'Operator',reason:['Tool past life limit','Tool broken','Chipped edge']},
 {k:'probe-calibration',n:'Probe Calibration',wait:'Probe calibration',next:'Calibrate and log it',who:'Cell lead',reason:['Probe touch-points past limit','Stylus change']},
 {k:'pivot-calibration',n:'Pivot Calibration',wait:'Pivot calibration',next:'Calibrate and log it',who:'Cell lead',reason:['Pivot cycle due','Geometry check after crash']},
 {k:'fixture-update',n:'Fixture Update',wait:'Fixture update',next:'Update the fixture',who:'Cell lead',reason:['Clamp wear, re-torque and shim','New fixture plate to load']},
 {k:'machine-maintenance',n:'Machine Maintenance',wait:'Maintenance',next:'Maintenance to attend',who:'Maintenance',reason:['Coolant pump noise','Spindle warm-up alarm','Chip conveyor jam']},
 {k:'machine-calibration',n:'Machine Calibration',wait:'Machine calibration',next:'Calibrate and log it',who:'Maintenance',reason:['Annual geometry check','Ballbar check after crash']},
 {k:'stoppage-gap',n:'Stoppage / Gap',wait:'Stoppage',next:'Close the ticket',who:'Production incharge',reason:['Waiting for material','No operator on shift','Waiting for program']},
 {k:'quality-ticket',n:'Quality Ticket',wait:'Quality report',next:'Quality to report',who:'Quality',reason:['Bore out of tolerance','Surface finish rejected','Height drifting high']}
];
var S={machines:[],items:[],entries:[],prod:[],cell:'',view:'dashboard',arg:'',range:30,asof:'today',asTable:false,open:{ov:1,tc:1},notice:'',tfilt:''};

function build(){
  var id=0,i;
  CELLS.forEach(function(c){STAGES.forEach(function(st,si){['A','B','C','D'].forEach(function(l){
    id++;var m={id:id,code:'C'+c.id+'-CNC'+(si+1)+'-'+l,cell:c.id,stage:st.n,stageIdx:si,state:'run',reason:'',since:addDays(TODAY,-ri(1,12)),hist:[]};
    S.machines.push(m);
    TDESC.forEach(function(t,ti){var used=Math.round(t[1]*lvl());S.items.push({kind:'Tool',m:m.code,cell:c.id,stage:st.n,code:'TL-'+(si+1)+('0'+(ti+1)).slice(-2),desc:t[0],used:used,limit:t[1],upd:addDays(TODAY,-ri(0,3))})});
    S.items.push({kind:'Probe',m:m.code,cell:c.id,stage:st.n,code:'PR-'+(si+1)+l,desc:'Touch probe',used:Math.round(150*lvl()),limit:150,upd:addDays(TODAY,-ri(0,3))});
    S.items.push({kind:'Fixture',m:m.code,cell:c.id,stage:st.n,code:'FX-'+(si+1)+l,desc:'Clamp fixture '+(si+1)+l,used:Math.round(2000*lvl()),limit:2000,upd:addDays(TODAY,-ri(0,3))});
    var last=addDays(TODAY,-(R()<.1?ri(31,36):R()<.2?ri(25,30):ri(0,24)));S.items.push({kind:'Pivot',m:m.code,cell:c.id,stage:st.n,code:'PV-'+(si+1)+l,desc:'Rotary pivot '+(si+1)+l,last:last,due:addDays(last,30)})
  })})});
  genEntries();
  /* machine stop history */
  S.machines.forEach(function(m){var k=ri(0,3);for(var j=0;j<k;j++){var d=addDays(TODAY,-ri(1,28)),st=ri(60,900),dur=ri(15,240),f=pick(FORMS);m.hist.push({from:d+' '+hm(st),to:d+' '+hm(st+dur),dur:dur,reason:f.wait,ticket:'#'+(4000+ri(1,900))})}m.hist.sort(function(a,b){return a.from<b.from?1:-1})});
  /* production days */
  for(i=89;i>=0;i--){var dt=addDays(TODAY,-i),wk=new Date(dt+'T00:00:00Z').getUTCDay(),planned=wk===0?ri(500,700):ri(1500,2100),rw=ri(10,Math.round(planned/35)),sc=ri(0,Math.round(planned/70));S.prod.push({d:dt,planned:planned,good:planned-rw-sc-ri(0,60),rework:rw,scrap:sc})}
  genExtra();sync()}
function LE(){return S.entries.filter(function(e){return !e.deleted})}
function sync(){S.machines.forEach(function(m){var t=LE().filter(function(e){return e.machine===m.code&&e.stops&&e.status!=='closed'})[0];m.state=t?'stop':'run';m.reason=t?t.wait:'';m.tid=t?t.id:0;m.mins=t?t.mins:0})}
var TH={near:80,alert:100,pivotCycle:30,pivotNear:5,overdueDays:3,logsHealth:15};
function lvl(){var r=R();return r<.05?1.02+R()*.3:r<.17?.82+R()*.17:.1+R()*.68}
function pct(i){return i.used/i.limit*100}
function stat(i){if(i.kind==='Pivot'){var d=daysBetween(TODAY,i.due);return d<0?'Alert':d<=TH.pivotNear?'Near limit':'OK'}var p=pct(i);return p>=TH.alert?'Alert':p>=TH.near?'Near limit':'OK'}
function sc(s){return s==='Alert'?'c-crit':s==='Near limit'?'c-warn':'c-ok'}
function bc(s){return s==='Alert'?'c':s==='Near limit'?'w':''}
function vis(a,k){k=k||'cell';return S.cell?a.filter(function(x){return x[k]===S.cell}):a}
function overdue(e){return e.status!=='closed'&&daysBetween(e.date,TODAY)>=TH.overdueDays}
function stats(){
  var ms=vis(S.machines),en=vis(LE()),it=vis(S.items);
  var open=en.filter(function(e){return e.status!=='closed'}),over=open.filter(overdue);
  var tools=it.filter(function(i){return i.kind==='Tool'}),pr=it.filter(function(i){return i.kind==='Probe'}),pv=it.filter(function(i){return i.kind==='Pivot'}),fx=it.filter(function(i){return i.kind==='Fixture'});
  var cnt=function(a,s){return a.filter(function(i){return stat(i)===s}).length};
  return{ms:ms,en:en,open:open,over:over,stopped:ms.filter(function(m){return m.state==='stop'}),
    tAl:cnt(tools,'Alert'),tNr:cnt(tools,'Near limit'),pAl:cnt(pr,'Alert'),pNr:cnt(pr,'Near limit'),vAl:cnt(pv,'Alert'),vNr:cnt(pv,'Near limit'),fAl:cnt(fx,'Alert'),fNr:cnt(fx,'Near limit'),
    dueToday:open.filter(function(e){return e.date===TODAY}).length,
    quality:en.filter(function(e){return e.form==='quality-ticket'&&e.status!=='closed'&&e.sev==='Danger'}),
    ng:en.filter(function(e){return e.form==='quality-ticket'&&e.date===TODAY}).length}}
function alerts(){var o=[];vis(S.items).forEach(function(i){var s=stat(i);if(s==='OK')return;
  var det=i.kind==='Tool'?'Tool '+i.code+' '+i.desc+' — '+i.used+'/'+i.limit+' parts':i.kind==='Probe'?'Probe '+i.code+' — '+i.used+'/'+i.limit+' touch-points':i.kind==='Fixture'?'Fixture '+i.code+' — '+i.used+'/'+i.limit+' cycles':'Pivot '+i.code+' — '+(daysBetween(TODAY,i.due)<0?'overdue by '+(-daysBetween(TODAY,i.due))+(daysBetween(TODAY,i.due)===-1?' day':' days')+' (was due '+i.due+')':'due in '+daysBetween(TODAY,i.due)+' days');
  o.push({type:{Tool:'Tool life',Probe:'Probe touch-points',Fixture:'Fixture cycles',Pivot:'Pivot calibration'}[i.kind],cell:i.cell,m:i.m,det:det,lvl:s==='Alert'?'Critical':'Warning',since:addDays(TODAY,-(hh(i.m+i.code)%9))})});
  o.sort(function(a,b){return (a.lvl==='Critical'?0:1)-(b.lvl==='Critical'?0:1)||(a.since<b.since?-1:1)});return o}

/* ================= pages ================= */
var PAGES={},ACT={},CHG={},SUB={};
function I(v,l,a){return {v:v,a:a||'',l:l}}
var NAV=[
 {id:'ov',t:'Overview',i:[I('dashboard','Dashboard'),I('machines','Machines'),I('tickets','Open Tickets'),I('queue','Quality Queue'),I('forms','Forms')]},
 {id:'tc',t:'Tools & calibration',i:[I('tool','Tool Life'),I('probe','Probe Calibration'),I('pivot','Pivot Calibration'),I('fixture','Fixture Fitness')]},
 {id:'lf',t:'Logs & forms',i:[I('log','Correction Entry','correction-entry'),I('log','Tool Change','tool-change'),I('log','Probe Calibration','probe-calibration'),I('log','Pivot Calibration','pivot-calibration'),I('log','Fixture Update','fixture-update'),I('log','Machine Maintenance','machine-maintenance'),I('log','Machine Calibration','machine-calibration'),I('log','Stoppage / Gap','stoppage-gap'),I('log','Frequency Part Check','frequency-check'),I('log','Issues','issues'),I('log','Root Cause','root-cause'),I('log','Quality Ticket','quality-ticket'),I('deleted','Deleted items')]},
 {id:'ps',t:'Production & shifts',i:[I('pentry','Production Entry'),I('plog','Production Log'),I('roster','Shift Roster'),I('people','People'),I('sdash','Shift dashboard')]},
 {id:'pr',t:'Planning & reports',i:[I('plan','Planning Board'),I('pva','Plan vs Actual'),I('patterns','Patterns'),I('evening','Evening summary'),I('report','Generate report')]},
 {id:'lb',t:'Libraries',i:[I('lib','Tools library','tool'),I('lib','Probes library','probe'),I('lib','Fixtures library','fixture'),I('lib','Pivots library','pivot'),I('cycle','Cycle Time library'),I('inspect','Inspection Time library'),I('features','Features'),I('freq','Frequency Check Interval')]},

function shiftPlan(m){return Math.floor(480*.85/cycOf(m))}
function genProdLog(){
  S.plog=[];S.pe={};
  var days=[];for(var i=7;i>=0;i--)days.push(addDays(TODAY,-i));
  days.forEach(function(d){['A','B','C'].forEach(function(sh){
    if(d===TODAY&&sh!=='A')return;
    S.machines.forEach(function(m){var pl=shiftPlan(m),h=hh(d+sh+m.code),sc=h%4===0?h%3:0,rw=h%7===0?1+h%4:0,g=Math.max(0,pl-(h%9)-sc-rw-(h%11===0?15:0));
      S.plog.push({d:d,sh:sh,m:m.code,cell:m.cell,stage:m.stage,planned:pl,good:g,rework:rw,scrap:sc,by:PEOPLE[h%PEOPLE.length]})})})});
  S.curShift='B'}
function peRow(m){var p=S.pe[m.code];if(!p){var h=hh('pe'+m.code);p=S.pe[m.code]={good:'',rework:0,scrap:0,done:false,planned:shiftPlan(m),by:PEOPLE[h%PEOPLE.length]}}return p}

/* performance */
PAGES.perf=function(){
  var rows=CELLS.map(function(c){var ms=S.machines.filter(function(m){return m.cell===c.id}),dt=ms.reduce(function(a,m){return a+m.hist.reduce(function(b,h){return b+h.dur},0)},0)+ms.reduce(function(a,m){return a+m.mins},0),avail=100-dt/(ms.length*30*480)*100,pr=S.prod.slice(-30),k=1/3,t=sumProd(pr),open=LE().filter(function(e){return e.cell===c.id&&e.status!=='closed'}).length,cl=LE().filter(function(e){return e.cell===c.id&&e.status==='closed'}).length;
    return{c:c,av:avail,yield:t.g/t.p*100,dt:dt,open:open,cl:cl}});
  var W=700,H=200,L=40,B=24,T=10,d=S.prod.slice(-30),mn=70,mx=100,y=function(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn))},x=function(i){return L+i*(W-L-6)/(d.length-1)};
  var pts=d.map(function(p,i){return x(i)+','+y(Math.max(mn,p.good/p.planned*100))}).join(' ');
  var grid='';for(var g=70;g<=100;g+=10)grid+='<line x1="'+L+'" x2="'+W+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="var(--grid)"/><text x="'+(L-6)+'" y="'+(y(g)+3)+'" text-anchor="end">'+g+'%</text>';
  return page('Performance','Availability and yield by cell over the last 30 days. Availability comes from the stop history on every machine, so tickets you close today change it.')
  +'<div class="card">'+tbl(['Cell','Availability','Yield','Downtime','Open tickets','Closed tickets'],rows.map(function(r){return '<tr><td><b>'+r.c.name+'</b></td><td>'+r.av.toFixed(1)+'%</td><td>'+r.yield.toFixed(1)+'%</td><td>'+fmtMin(r.dt)+'</td><td>'+r.open+'</td><td>'+r.cl+'</td></tr>'}))+'</div>'
  +'<div class="card"><h2>Daily yield</h2><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Daily yield">'+grid+'<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.2"/>'+d.map(function(p,i){return i%6===0?'<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+dd(p.d)+'</text>':''}).join('')+'</svg></div>'};
/* ================= admin ================= */
function visF(k){return FDEF[k].fields.filter(function(f){var s=S.fset[k]&&S.fset[k][f.k];return !s||s.show!==false})}
function reqF(k,f){var s=S.fset[k]&&S.fset[k][f.k];return !!(s&&s.req)}
PAGES.fields=function(){
  var k=S.arg&&FDEF[S.arg]?S.arg:(S.fsel||'correction-entry'),D=FDEF[k];
  return page('Field settings','Choose which fields each form shows and which are required. The New buttons on every log follow these settings straight away.')
  +filt(lbl('Form','<select data-chg="fsel">'+opts(FORMS.map(function(f){return [f.k,f.n]}),k)+'</select>'))
  +'<div class="card">'+tbl(['Field','Type','Shown','Required'],D.fields.map(function(f){var s=(S.fset[k]&&S.fset[k][f.k])||{show:true,req:false};return '<tr><td><b>'+f.l+'</b></td><td>'+({sel:'Choice',num:'Number',text:'Text',area:'Long text',person:'Person',date:'Date'}[f.t]||'Text')+'</td><td><input type="checkbox" data-chg="fset" data-k="'+k+'" data-f="show" data-x="'+f.k+'"'+(s.show!==false?' checked':'')+'></td><td><input type="checkbox" data-chg="fset" data-k="'+k+'" data-f="req" data-x="'+f.k+'"'+(s.req?' checked':'')+'></td></tr>'}))+'</div>'};
CHG.fsel=function(t){S.fsel=t.value;draw()};
CHG.fset=function(t){var d=t.dataset;(S.fset[d.k]=S.fset[d.k]||{});var s=S.fset[d.k][d.x]=S.fset[d.k][d.x]||{show:true,req:false};
  /* "f" is also the generic select hook, so use the explicit data-f value here */
  if(d.f==='show')s.show=t.checked;else s.req=t.checked;S.notice='Saved. Open the log for this form and press New to see it.';draw()};
PAGES.thresh=function(){
  var al=alerts(),rows=[['near','Near-limit warning at (% of limit)',TH.near,'Tools, probes and fixtures turn amber at this point.'],['alert','Alert at (% of limit)',TH.alert,'Turns red and raises a critical alert.'],['pivotCycle','Pivot calibration cycle (days)',TH.pivotCycle,'Days between pivot calibrations.'],['pivotNear','Pivot warning (days before due)',TH.pivotNear,'Amber this many days before the due date.'],['overdueDays','Ticket overdue after (days)',TH.overdueDays,'Open tickets older than this show as overdue.'],['logsHealth','Logs health limit (% overdue)',TH.logsHealth,'Forms page turns red above this.']];
  return page('Threshold settings','Every limit the dashboards use. Change a number and the whole demo recalculates; nothing here needs a restart.')
  +'<div class="tiles">'+tile('w','⚠',al.length,'Alerts right now','dashboard')+tile('r','■',al.filter(function(a){return a.lvl==='Critical'}).length,'Critical','dashboard')+tile('w','⏱',stats().over.length,'Overdue tickets','tickets')+'</div>'
  +'<div class="card"><form class="form" data-sub="thresh" style="grid-template-columns:1fr 1fr">'+rows.map(function(r){return '<label>'+r[1]+'<input type="number" name="'+r[0]+'" value="'+r[2]+'" min="1" required><span class="hint">'+r[3]+'</span></label>'}).join('')+'<div style="grid-column:1/-1"><button class="btn p" type="submit">Save thresholds</button> <button class="btn" type="button" data-act="threshreset">Reset to defaults</button></div></form></div>'};
SUB.thresh=function(f){var fd=new FormData(f);['near','alert','pivotCycle','pivotNear','overdueDays','logsHealth'].forEach(function(k){TH[k]=+fd.get(k)});
  S.items.forEach(function(i){if(i.kind==='Pivot')i.due=addDays(i.last,TH.pivotCycle)});logAct('Thresholds saved','','','TH','Near '+TH.near+'%, alert '+TH.alert+'%');S.notice='Thresholds saved. There are now '+alerts().length+' alerts.';draw()};
ACT.threshreset=function(){TH.near=80;TH.alert=100;TH.pivotCycle=30;TH.pivotNear=5;TH.overdueDays=3;TH.logsHealth=15;S.items.forEach(function(i){if(i.kind==='Pivot')i.due=addDays(i.last,30)});S.notice='Defaults restored.';draw()};
/* users */
function genUsers(){S.users=PEOPLE.map(function(n,i){return{n:n,email:n.toLowerCase().replace(/[^a-z]+/g,'.')+'@demo-plant.example',role:PROLE[i],cell:String(i%3+1),on:i!==9}});S.users.unshift({n:'Demo manager',email:'manager@demo-plant.example',role:'Admin',cell:'All',on:true})}
PAGES.users=function(){
  return page('Users','Who can sign in, their role and cell. Switching someone off keeps their history but ends their access.','<button class="btn p" data-act="useradd">+ Invite user</button>')
  +'<div class="card">'+tbl(['Name','Email','Role','Cell','Status',''],S.users.map(function(u,i){return '<tr><td><b>'+esc(u.n)+'</b></td><td>'+esc(u.email)+'</td><td><select data-chg="userrole" data-i="'+i+'">'+opts(ROLES,u.role)+'</select></td><td>'+(u.cell==='All'?'All cells':'Cell '+u.cell)+'</td><td><span class="chip '+(u.on?'c-ok':'c-idle')+'">'+(u.on?'Active':'Off')+'</span></td><td><button class="btn sm" data-act="usertog" data-i="'+i+'">'+(u.on?'Switch off':'Switch on')+'</button></td></tr>'}))+'</div>'};
CHG.userrole=function(t){var u=S.users[+t.dataset.i];u.role=t.value;logAct('User changed','','',u.n,'Role '+u.role);S.notice=u.n+' is now '+u.role+'.';draw()};
ACT.usertog=function(el){var u=S.users[+el.dataset.i];u.on=!u.on;logAct('User changed','','',u.n,u.on?'Switched on':'Switched off');draw()};
ACT.useradd=function(){modal(mhead('Invite user')+'<form class="form" data-sub="useradd"><label>Name<input type="text" name="n" required></label><label>Email<input type="email" name="e" required placeholder="name@example.com"></label><label>Role<select name="r">'+opts(ROLES,'Operator')+'</select></label><label>Cell<select name="c">'+cellOpts('1',false)+'</select></label><div class="hint">Demo only: no invite email is sent.</div><div><button class="btn p" type="submit">Add user</button></div></form>')};
SUB.useradd=function(f){var fd=new FormData(f);S.users.push({n:fd.get('n'),email:fd.get('e'),role:fd.get('r'),cell:fd.get('c'),on:true});logAct('User added','','',fd.get('n'),fd.get('r'));closeModal();S.notice=fd.get('n')+' added.';draw()};
/* permissions */
var PERMS=['View dashboards','Raise tickets','Close tickets','Approve corrections','Delete entries','Edit libraries','Edit thresholds','Manage users'];
function genPerms(){S.perms={};var allow={Admin:[1,1,1,1,1,1,1,1],Manager:[1,1,1,1,1,1,1,0],'Cell lead':[1,1,1,0,0,0,0,0],Operator:[1,1,0,0,0,0,0,0],Quality:[1,1,1,1,0,0,0,0],Maintenance:[1,1,1,0,0,0,0,0],Viewer:[1,0,0,0,0,0,0,0]};ROLES.forEach(function(r){S.perms[r]=allow[r].slice()})}
PAGES.perms=function(){

/* dashboard layouts */
var WIDGETS=[['cells','Cell cards'],['prod','Production vs rejects'],['activity','Recent activity and downtime'],['reasons','Downtime by reason'],['alerts','Alerts table']];
PAGES.layouts=function(){
  return page('Dashboard Layouts','Choose which blocks the Dashboard shows. Switch one off, then open the Dashboard to see it gone.')
  +'<div class="card">'+WIDGETS.map(function(w){return '<label style="display:flex;gap:10px;align-items:center;margin:8px 0;font-weight:500"><input type="checkbox" data-chg="layout" data-w="'+w[0]+'"'+(S.hidden[w[0]]?'':' checked')+'> '+w[1]+'</label>'}).join('')+'<button class="btn" data-act="layreset">Show everything</button></div>'};
CHG.layout=function(t){S.hidden[t.dataset.w]=!t.checked;S.notice='Layout saved.';draw()};

function applyLayout(){Object.keys(S.hidden||{}).forEach(function(k){if(S.hidden[k])Array.prototype.forEach.call(document.querySelectorAll('[data-w="'+k+'"]'),function(n){n.style.display='none'})})}
/* activity log */
PAGES.activity=function(){
  var f=S.acf=S.acf||{ev:'',q:'',page:1},evs=Array.from(new Set(S.activity.map(function(a){return a.ev}))).sort(),
    rows=S.activity.filter(function(a){return (!f.ev||a.ev===f.ev)&&(!S.cell||a.cell==='Cell '+S.cell)&&(!f.q||(a.m+a.code+a.desc+a.user).toLowerCase().indexOf(f.q.toLowerCase())>-1)}),pages=Math.max(1,Math.ceil(rows.length/20));if(f.page>pages)f.page=pages;
  return page('Activity Log','Everything that happened, newest first. Every action you take in this demo shows up here.','<button class="btn" data-act="acxls">Download as Excel</button>')
  +filt(lbl('Event','<select data-chg="acf" data-p="ev">'+opts(evs,f.ev,'All events')+'</select>')+lbl('Cell','<select data-f="cell">'+cellOpts(S.cell)+'</select>')+lbl('Search','<input type="text" data-inp="acq" value="'+esc(f.q)+'" placeholder="Machine, code, person">'))
  +'<div class="card">'+tbl(['When','Event','Cell','Machine','Code','Detail','By'],rows.slice((f.page-1)*20,f.page*20).map(function(a){return '<tr><td>'+a.t+'</td><td>'+a.ev+'</td><td>'+a.cell+'</td><td>'+a.m+'</td><td>'+a.code+'</td><td>'+esc(a.desc)+'</td><td>'+a.user+'</td></tr>'}),'tall')
  +'<div class="filters" style="margin-top:10px;justify-content:space-between"><span class="hint">'+rows.length+' events</span><span class="filters"><button class="btn sm" data-act="acpage" data-d="-1">‹ Prev</button><span>Page '+f.page+' of '+pages+'</span><button class="btn sm" data-act="acpage" data-d="1">Next ›</button></span></div></div>'};
